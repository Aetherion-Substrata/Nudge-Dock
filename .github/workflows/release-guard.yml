name: release-guard
# Hard stop for release files. Every published or edited release is unpacked and scanned for personal
# absolute paths of the build machine (.github/scripts/release-scan.sh). On a hit the release is pulled
# back to a draft, so its files stop being public, and this run fails.
# Run the same script on the files BEFORE publishing:  bash .github/scripts/release-scan.sh <folder>
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan (report only, the release is not changed)
        required: true
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download the release files
        run: |
          mkdir -p "$RUNNER_TEMP/rel"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/rel" || echo "no files on this release"
          command -v 7z >/dev/null || sudo apt-get install -y -q p7zip-full
      - name: Scan
        id: scan
        run: bash .github/scripts/release-scan.sh "$RUNNER_TEMP/rel"
      - name: Pull the release back to a draft
        if: failure() && steps.scan.outcome == 'failure' && github.event_name == 'release'
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
